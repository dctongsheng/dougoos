name: Visual diagnostic macOS 14

on:
  workflow_dispatch:
    inputs:
      case:
        description: Exact production visual case id
        required: true
        default: saas-settings-customize--saas-1280x800

permissions:
  contents: read

jobs:
  diagnose:
    name: Capture one production visual case
    runs-on: macos-14
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Chromium
        run: pnpm exec playwright install chromium

      - name: Build the production web bundle
        run: pnpm --filter @dougoos/web build

      - name: Capture requested production case
        run: pnpm exec tsx tests/visual/diagnose-production.ts --case="${{ inputs.case }}"

      - name: Upload visual diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diagnostic-${{ github.sha }}
          path: .artifacts/visual-diagnostic
          if-no-files-found: error
          retention-days: 7
