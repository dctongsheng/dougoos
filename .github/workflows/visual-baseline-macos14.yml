name: Visual baseline macOS 14

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-baseline:
    name: Capture canonical references
    runs-on: macos-14
    timeout-minutes: 45
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Chromium
        run: pnpm exec playwright install chromium

      - name: Build visual sites
        run: |
          pnpm -r build
          pnpm --filter @dougoos/web build:visual

      - name: Diagnose settings geometry
        run: pnpm exec playwright test tests/visual/debug-settings.spec.ts --project=visual
